<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>16 Sunnyvale Defects</title>
<style>
:root{--bg:#eef0f3;--surface:#fbfbf7;--fg:#1b2438;--muted:#55607a;--line:#d6dae4;--ink:#1d2a44;--open:#c0392b;--prog:#c98a12;--fixed:#2b6cb0;--closed:#2f9a63;--code:#f1f2f6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11151d;--surface:#181e29;--fg:#e6e9f1;--muted:#9aa4bb;--line:#2b3343;--ink:#b9b6f7;--open:#ef7a6c;--prog:#e3b04b;--fixed:#7ab0ec;--closed:#5cc48d;--code:#1f2633;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 64px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px}
h1{margin:0;font-size:clamp(24px,4vw,34px);line-height:1.1}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#gate{max-width:380px;margin:12vh auto 0;display:grid;gap:12px}
input,select,button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink)}
button.sec{background:var(--surface);color:var(--fg);border-color:var(--line)}
#err{color:var(--open);min-height:1.3em;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input{flex:1;min-width:160px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.lot{display:grid;gap:8px}
.lot h2{font-size:18px;margin:10px 0 0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.id{font:500 12px ui-monospace,Menlo,monospace;color:var(--muted);padding-top:3px}
.title{font-weight:600}
.detail,.comment{grid-column:2/4;margin:0;font-size:14px}
.comment{color:var(--muted)}
.meta{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.badge{font:600 11.5px/1 ui-monospace,Menlo,monospace;text-transform:uppercase;padding:5px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.s-open{color:var(--open)}.s-in_progress{color:var(--prog)}.s-fixed{color:var(--fixed)}.s-closed{color:var(--closed)}
.sev-critical .title::before{content:"● ";color:var(--open)}.sev-major .title::before{content:"● ";color:var(--prog)}
.item.closed{opacity:.6}
.hide{display:none!important}
@media print{body{background:#fff;color:#000}.bar,#gate,button{display:none!important}.card{break-inside:avoid;border-color:#999}}
</style></head><body>
<div id="gate" class="card">
  <h1>16 Sunnyvale Defects</h1>
  <p class="muted" style="margin:0">Enter the passcode to view the defects list.</p>
  <form id="f" style="display:grid;gap:10px"><input id="pw" type="password" autocomplete="current-password" placeholder="Passcode" autofocus><button>View</button></form>
  <p id="err" role="alert"></p>
</div>
<div class="wrap hide" id="app">
  <header><h1>16 Sunnyvale Road · Defects</h1><p class="muted" id="upd" style="margin:6px 0 0"></p></header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search defects">
    <select id="lot"><option value="">All units</option></select>
    <select id="st"><option value="active">Open items only</option><option value="">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="fixed">Fixed, awaiting check</option><option value="closed">Closed</option></select>
    <button class="sec" onclick="print()">Print</button>
  </div>
  <div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LABEL={open:'Open',in_progress:'In progress',fixed:'Fixed',closed:'Closed'};
let D=[];
async function unlock(pw){
  const r=await fetch('data.enc.json',{cache:'no-store'}); if(!r.ok) throw new Error('nodata');
  const e=await r.json(), km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},k,b64(e.ct))));
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const q=$('q').value.toLowerCase(), lot=$('lot').value, st=$('st').value;
  const rows=D.filter(d=>(!lot||d.lot===lot)&&(st===''||(st==='active'?d.status!=='closed':d.status===st))&&(!q||JSON.stringify(d).toLowerCase().includes(q)));
  const by={}; rows.forEach(d=>(by[d.lot]??=[]).push(d));
  $('list').innerHTML=Object.keys(by).sort().map(l=>`<section class="lot"><h2>${esc(l)} <span class="muted" style="font-weight:400;font-size:14px">${by[l].length}</span></h2>`+by[l].map(d=>`<article class="card item sev-${esc(d.severity)} ${d.status==='closed'?'closed':''}"><span class="id">${esc(d.id)}</span><span class="title">${esc(d.title)}</span><span class="badge s-${esc(d.status)}">${LABEL[d.status]||esc(d.status)}</span>${d.detail?`<p class="detail">${esc(d.detail)}</p>`:''}${d.comment?`<p class="comment">Builder: ${esc(d.comment)}</p>`:''}<span class="meta">${esc(d.location)} · raised ${esc(d.raised)}${d.closed?` · closed ${esc(d.closed)}`:''}</span></article>`).join('')+'</section>').join('')||'<p class="muted">No defects match.</p>';
}
function start(data){
  D=data.defects||[]; $('upd').textContent='Updated '+(data.updated||'');
  const n=s=>D.filter(d=>d.status===s).length;
  $('stats').innerHTML=[['Open',n('open')],['In progress',n('in_progress')],['Fixed, awaiting check',n('fixed')],['Closed',n('closed')],['Total',D.length]].map(([a,c])=>`<span class="stat"><b>${c}</b> ${a}</span>`).join('');
  [...new Set(D.map(d=>d.lot))].sort().forEach(l=>$('lot').add(new Option(l,l)));
  $('gate').classList.add('hide'); $('app').classList.remove('hide'); render();
  ['q','lot','st'].forEach(i=>$(i).addEventListener('input',render));
}
$('f').addEventListener('submit',async ev=>{ev.preventDefault();$('err').textContent='';
  try{const pw=$('pw').value; const data=await unlock(pw); try{sessionStorage.setItem('dpw',pw)}catch(_){} start(data);}
  catch(e){$('err').textContent=e.message==='nodata'?'No defects published yet.':'Wrong passcode.'}});
try{const p=sessionStorage.getItem('dpw'); if(p) unlock(p).then(start).catch(()=>{});}catch(_){}
</script></body></html>
